<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkVault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 360px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f12;
            color: #f0f0f5;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a38;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        .header span { font-size: 20px; }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #a0a0b0;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: #1e1e28;
            border: 1px solid #2a2a38;
            border-radius: 6px;
            color: #f0f0f5;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #6366f1;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #5558e6; }
        .btn:disabled {
            background: #2a2a38;
            color: #606070;
            cursor: not-allowed;
        }
        .success {
            text-align: center;
            padding: 20px;
            color: #10b981;
        }
        .success span { font-size: 32px; display: block; margin-bottom: 8px; }
        .error {
            text-align: center;
            padding: 12px;
            color: #ef4444;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>🔗</span>
        <h1>LinkVault</h1>
    </div>

    <div id="form">
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="title" placeholder="Título da página">
        </div>

        <div class="form-group">
            <label>URL</label>
            <input type="url" id="url" placeholder="https://exemplo.com" readonly>
        </div>

        <div class="form-group">
            <label>Descrição</label>
            <textarea id="description" rows="2" placeholder="Breve descrição"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Categoria</label>
                <select id="category"></select>
            </div>
            <div class="form-group">
                <label>Prioridade</label>
                <select id="priority">
                    <option value="low">🟢 Baixa</option>
                    <option value="medium" selected>🟡 Média</option>
                    <option value="high">🔴 Alta</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Tags (separadas por vírgula)</label>
            <input type="text" id="tags" placeholder="tag1, tag2">
        </div>

        <button class="btn" id="saveBtn">Salvar no LinkVault</button>
        <div id="message"></div>
    </div>

    <div id="success" class="success hidden">
        <span>✅</span>
        <p>Link salvo com sucesso!</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
